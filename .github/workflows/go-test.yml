name: Go tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_libs:
        description: "Build FFmpeg libraries from source instead of downloading"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect build mode
    runs-on: ubuntu-24.04
    outputs:
      build_libs: ${{ steps.mode.outputs.build_libs }}
      windows_assets: ${{ steps.windows-assets.outputs.windows_assets || 'false' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether to build libraries from source
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_LIBS: ${{ inputs.build_libs }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          build_libs=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "$INPUT_BUILD_LIBS" == "true" ]]; then
                build_libs=true
              fi
              ;;
            pull_request|push)
              if [[ "$EVENT_NAME" == "pull_request" ]]; then
                if git rev-parse --verify -q HEAD^2 >/dev/null; then
                  range="HEAD^1..HEAD"
                else
                  range="${PR_BASE_SHA}...HEAD"
                fi
              else
                if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                  range="HEAD~1..HEAD"
                else
                  range="${BEFORE}..HEAD"
                fi
              fi

              changed_files=$(git diff --name-only "$range")
              while IFS= read -r file; do
                case "$file" in
                  internal/builder/*|include/*|ffmpeg_link_*.go|.github/workflows/_build-libs.yml)
                    build_libs=true
                    break
                    ;;
                esac
              done <<< "$changed_files"

              if [[ "$build_libs" == "false" ]]; then
                fetch_diff=$(git diff -U0 "$range" -- lib/fetch.go)
                if grep -Eq '^[+-][[:space:]]*const[[:space:]]+LibRelease[[:space:]]*=' <<< "$fetch_diff"; then
                  build_libs=true
                fi
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          echo "build_libs=$build_libs" >> "$GITHUB_OUTPUT"

      - name: Check Windows release assets
        if: steps.mode.outputs.build_libs == 'false'
        id: windows-assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(sed -En 's/^[[:space:]]*const[[:space:]]+LibRelease[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' lib/fetch.go)
          if [[ ! "$tag" =~ ^lib-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing LibRelease in lib/fetch.go: $tag"
            exit 1
          fi
          api="https://api.github.com/repos/linuxmatters/ffmpeg-statigo/releases/tags/${tag}"
          body_file="${RUNNER_TEMP}/release.json"
          http_code=$(curl --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [[ "$http_code" != "200" ]]; then
            echo "::error::GitHub API returned HTTP $http_code for release $tag"
            exit 1
          fi
          windows_assets=$(jq -r '
            if (.assets | type) != "array" then
              error("Missing release asset metadata")
            else
              (.assets | map(.name)) as $names |
              [
                "ffmpeg-windows-amd64.tar.gz",
                "ffmpeg-windows-386.tar.gz",
                "ffmpeg-embedded-windows-amd64.tar.gz",
                "ffmpeg-embedded-windows-386.tar.gz"
              ] | all(. as $a | $names | index($a) != null)
            end
          ' "$body_file")
          echo "windows_assets=$windows_assets" >> "$GITHUB_OUTPUT"
          if [[ "$windows_assets" != "true" ]]; then
            echo "::notice::Release $tag does not contain all Windows library archives. Skipping test-windows."
          fi

  build-libs:
    needs: detect
    if: needs.detect.outputs.build_libs == 'true'
    uses: ./.github/workflows/_build-libs.yml

  test-unix:
    name: Test ${{ matrix.variant }} on ${{ matrix.os }} ${{ matrix.arch }}
    needs: [detect, build-libs]
    if: >-
      !cancelled() &&
      needs.detect.result == 'success' &&
      (needs.detect.outputs.build_libs == 'false' ||
      needs.build-libs.result == 'success')
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      ASSET_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded-' || '' }}
      PLATFORM: ${{ matrix.os }}_${{ matrix.arch }}
      ASSET_PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
        variant: [default, embedded]
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download built FFmpeg library
        if: needs.detect.outputs.build_libs == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts

      - name: Extract built FFmpeg library
        if: needs.detect.outputs.build_libs == 'true'
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir -p lib
          tar -xzf "${ARTIFACTS_DIR}/ffmpeg-${ASSET_PREFIX}${ASSET_PLATFORM}.tar.gz" -C lib
          test -s "lib/${LIB_PREFIX}${PLATFORM}/libffmpeg.a"

      - name: Download FFmpeg libraries
        if: needs.detect.outputs.build_libs == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/download-lib/

      - name: Build
        run: go build -v ./...

      # macOS can warn about a version mismatch when newer macOS built the
      # static libraries. The libraries target MACOSX_DEPLOYMENT_TARGET=13.0.
      - name: Test
        run: go test -v ./...

      # Race detector on one leg. The global callback registries and cgo
      # bridges are platform-independent, so one platform suffices.
      - name: Test (race)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test -race -count=1 ./...

      # Lint on one leg, over every package including internal/generator.
      - name: Lint
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: >-
            ${{ matrix.variant == 'embedded' &&
            '--build-tags=embedded ./...' || './...' }}

      # Regenerate the Go bindings from the FFmpeg headers. The parser is pure
      # Go (modernc.org/cc/v4), so there is nothing to install, and the parse is
      # hermetic: it reads the committed headers under include/ and the stub C
      # library headers embedded from internal/generator/sysinclude/, never the
      # runner's own compiler or system headers.
      #
      # Gated on every platform. The committed *.gen.go must come back
      # byte-identical from all four legs, so a parse failure or a drift on any
      # one of them fails the build. Output is not filtered: a warning that only
      # appears on one platform is exactly what this step exists to surface.
      - name: Run generator
        if: matrix.variant == 'default'
        run: go run ./internal/generator

      - name: Check for generated code differences
        if: matrix.variant == 'default'
        run: |
          if git diff --quiet -- ./*.gen.go; then
            echo "::notice title=Generated Code Match on" \
              "${{ matrix.os }}/${{ matrix.arch }}::Generated bindings" \
              "match committed version."
          else
            echo "::error title=Generated Code Drift on" \
              "${{ matrix.os }}/${{ matrix.arch }}::Generated bindings" \
              "differ from committed version. Run 'just generate' and commit" \
              "the updated *.gen.go."
            git diff -- ./*.gen.go
            exit 1
          fi

  test-windows:
    name: Test ${{ matrix.variant }} on windows ${{ matrix.arch }}
    needs: [detect, build-libs]
    if: >-
      !cancelled() &&
      needs.detect.result == 'success' &&
      ((needs.detect.outputs.build_libs == 'true' &&
      needs.build-libs.result == 'success') ||
      (needs.detect.outputs.build_libs == 'false' &&
      needs.detect.outputs.windows_assets == 'true'))
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
        variant: [default, embedded]
        include:
          - arch: amd64
            msystem: UCRT64
            bin: /ucrt64/bin
            package-prefix: mingw-w64-ucrt-x86_64
            cc-target: x86_64-w64-mingw32
          - arch: "386"
            msystem: MINGW32
            bin: /mingw32/bin
            package-prefix: mingw-w64-i686
            cc-target: i686-w64-mingw32
    defaults:
      run:
        shell: msys2 {0}
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
      MINGW_BIN: ${{ matrix.bin }}
      CC_TARGET: ${{ matrix.cc-target }}
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      ASSET_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded-' || '' }}

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Capture Go binary directory
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go).Source
          "GO_BIN=$goBin" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      # msys2/setup-msys2 v2.33.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          path-type: minimal
          install: >-
            ${{ matrix.package-prefix }}-binutils
            ${{ matrix.package-prefix }}-gcc

      - name: Configure and validate toolchain
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          CC="$(cygpath -m "$MINGW_BIN/gcc.exe")"
          CXX="$(cygpath -m "$MINGW_BIN/g++.exe")"
          export CC CXX
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          go version
          go env GOOS GOARCH CGO_ENABLED CC CXX GOFLAGS
          "$CC" --version
          "$CC" -dumpmachine
          test "$("$CC" -dumpmachine)" = "$CC_TARGET"

      - name: Download built FFmpeg library
        if: needs.detect.outputs.build_libs == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.variant }}-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts

      - name: Extract built FFmpeg library
        if: needs.detect.outputs.build_libs == 'true'
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          artifacts_dir="$(cygpath -u "$ARTIFACTS_DIR")"
          mkdir -p lib
          tar -xzf "${artifacts_dir}/ffmpeg-${ASSET_PREFIX}windows-${GOARCH}.tar.gz" -C lib
          test -s "lib/${LIB_PREFIX}windows_${GOARCH}/libffmpeg.a"

      - name: Download FFmpeg libraries
        if: needs.detect.outputs.build_libs == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go run ./cmd/download-lib/

      - name: Build
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go build -v ./...

      - name: Test
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go test -v ./...
