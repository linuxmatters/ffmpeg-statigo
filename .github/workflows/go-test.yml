name: Go tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download FFmpeg libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/download-lib/

      - name: Build
        run: go build -v ./...

      # Note: macOS may show linker warnings about version mismatches if the static
      # libraries were built on a newer macOS version than the runner.
      # These warnings are harmless - the libraries have MACOSX_DEPLOYMENT_TARGET=13.0
      - name: Test
        run: go test -v ./...

      # Race detector on one leg. The global callback registries and cgo
      # bridges are platform-independent, so one platform suffices.
      - name: Test (race)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go test -race -count=1 ./...

      # Lint on one leg, over every package including internal/generator.
      - name: Lint
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      # Regenerate the Go bindings from the FFmpeg headers. The parser is pure
      # Go (modernc.org/cc/v4), so there is nothing to install; cc.NewConfig
      # asks the runner's own C compiler for its predefined macros and include
      # search paths.
      #
      # Gated on every platform. The committed *.gen.go must come back
      # byte-identical from all four legs, so a parse failure or a drift on any
      # one of them fails the build. Output is not filtered: a warning that only
      # appears on one platform is exactly what this step exists to surface.
      - name: Run generator
        run: go run ./internal/generator

      - name: Check for generated code differences
        run: |
          if git diff --quiet -- ./*.gen.go; then
            echo "::notice title=Generated Code Match on ${{ matrix.os }}/${{ matrix.arch }}::Generated bindings match committed version."
          else
            echo "::error title=Generated Code Drift on ${{ matrix.os }}/${{ matrix.arch }}::Generated bindings differ from committed version. Run 'just generate' and commit the updated *.gen.go."
            git diff -- ./*.gen.go
            exit 1
          fi
