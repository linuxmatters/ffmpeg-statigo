name: Windows embedded source test

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-embedded-test:
    name: Test embedded for Windows ${{ matrix.goarch }}
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            msystem: UCRT64
            bin: /ucrt64/bin
            package-prefix: mingw-w64-ucrt-x86_64
            yasm-package: mingw-w64-ucrt-x86_64-yasm
          - goarch: '386'
            msystem: MINGW32
            bin: /mingw32/bin
            package-prefix: mingw-w64-i686
            yasm-package: yasm
    defaults:
      run:
        shell: msys2 {0}
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      MINGW_BIN: ${{ matrix.bin }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=embedded
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Capture Go binary directory
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go).Source
          "GO_BIN=$goBin" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      # msys2/setup-msys2 v2.33.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: false
          path-type: minimal
          install: >-
            autoconf
            automake
            diffutils
            git
            libtool
            make
            patch
            perl
            ${{ matrix.package-prefix }}-binutils
            ${{ matrix.package-prefix }}-cmake
            ${{ matrix.package-prefix }}-gcc
            ${{ matrix.package-prefix }}-nasm
            ${{ matrix.package-prefix }}-ninja
            ${{ matrix.package-prefix }}-pkgconf
            ${{ matrix.package-prefix }}-python
            ${{ matrix.yasm-package }}

      - name: Record toolchain
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          export CC="$(cygpath -m "$MINGW_BIN/gcc.exe")"
          export CXX="$(cygpath -m "$MINGW_BIN/g++.exe")"
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          go version
          go env GOOS GOARCH CGO_ENABLED CC CXX GOFLAGS
          "$CC" --version
          "$CC" -dumpmachine
          if [ "$GOARCH" = 386 ]; then
            test "$("$CC" -dumpmachine)" = i686-w64-mingw32
          fi
          "$CXX" --version
          cmake --version
          ninja --version
          ar --version
          pacman -Q
          df -h .

      - name: Build FFmpeg from source
        env:
          MSYS2_ENV_CONV_EXCL: ACLOCAL_PATH
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          go run ./internal/builder/ --embedded

      - name: Check embedded archive
        run: |
          set -euo pipefail
          archive="lib/embedded/windows_${GOARCH}/libffmpeg.a"
          test -s "$archive"
          ls -lh "$archive"
          sha256sum "$archive"
          ar t "$archive" | awk '
            NR <= 20 { print }
            END { print "Archive members:", NR; if (NR == 0) exit 1 }
          '
          if [ "$GOARCH" = 386 ] && command -v objdump >/dev/null 2>&1; then
            objdump -f "$archive" | awk '
              /^architecture:/ {
                if (++members <= 20) print
                if ($2 != "i386,") invalid = 1
              }
              END {
                print "Archive object headers:", members
                if (members == 0 || invalid) exit 1
              }
            '
          fi
          df -h .

      - name: Build Go packages
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          go build ./...

      - name: Diagnose Windows 386 swscale
        if: matrix.goarch == '386'
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          go test -c -o ffmpeg.test.exe .
          set +e
          ./ffmpeg.test.exe -test.run '^TestSwsScale$' -test.count=1 -test.v \
            > swscale-test.log 2>&1
          test_status=$?
          cat swscale-test.log
          printf 'Isolated TestSwsScale exit status: %s\n' "$test_status"
          if [ "$test_status" -ne 0 ]; then
            pacman -S --noconfirm --needed mingw-w64-i686-gdb
            install_status=$?
            printf 'GDB installation exit status: %s\n' "$install_status"
            if [ "$install_status" -eq 0 ]; then
              gdb --batch -ex 'set pagination off' -ex run \
                -ex 'bt full' -ex 'info registers' \
                -ex 'info symbol $pc' -ex 'x/12i $pc' \
                --args ./ffmpeg.test.exe \
                -test.run '^TestSwsScale$' -test.count=1 -test.v \
                > swscale-gdb.log 2>&1
              gdb_status=$?
              cat swscale-gdb.log
              printf 'GDB exit status: %s\n' "$gdb_status"
            fi
          fi
          exit "$test_status"

      - name: Test Go packages on Windows
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          go test -v ./...

      - name: Record test executable DLL imports
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$(cygpath -u "$GO_BIN"):$PATH"
          if command -v objdump >/dev/null 2>&1; then
            go test -c -o ffmpeg.test.exe .
            objdump -p ffmpeg.test.exe | awk '/DLL Name:/ { print }'
          else
            echo "objdump is unavailable; DLL imports were not recorded."
          fi
