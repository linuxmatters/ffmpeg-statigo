name: Windows embedded source test

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-embedded-test:
    name: Test embedded for Windows amd64
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "1"
      GOFLAGS: -tags=embedded
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Capture Go binary directory
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go).Source
          "GO_BIN=$goBin" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      # msys2/setup-msys2 v2.33.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          path-type: minimal
          install: >-
            autoconf
            automake
            diffutils
            git
            libtool
            make
            patch
            perl
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-yasm

      - name: Record toolchain
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$(cygpath -u "$GO_BIN"):$PATH"
          export CC="$(cygpath -m /ucrt64/bin/gcc.exe)"
          export CXX="$(cygpath -m /ucrt64/bin/g++.exe)"
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          go version
          go env GOOS GOARCH CGO_ENABLED CC CXX GOFLAGS
          "$CC" --version
          "$CC" -dumpmachine
          "$CXX" --version
          cmake --version
          ninja --version
          ar --version
          pacman -Q
          df -h .

      - name: Build FFmpeg from source
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$(cygpath -u "$GO_BIN"):$PATH"
          go run ./internal/builder/ --embedded

      - name: Check embedded archive
        run: |
          set -euo pipefail
          archive=lib/embedded/windows_amd64/libffmpeg.a
          test -s "$archive"
          ls -lh "$archive"
          sha256sum "$archive"
          ar t "$archive" | awk '
            NR <= 20 { print }
            END { print "Archive members:", NR; if (NR == 0) exit 1 }
          '
          df -h .

      - name: Build Go packages
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$(cygpath -u "$GO_BIN"):$PATH"
          go build ./...

      - name: Test Go packages on Windows
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$(cygpath -u "$GO_BIN"):$PATH"
          go test ./...

      - name: Record test executable DLL imports
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$(cygpath -u "$GO_BIN"):$PATH"
          if command -v objdump >/dev/null 2>&1; then
            go test -c -o ffmpeg.test.exe .
            objdump -p ffmpeg.test.exe | awk '/DLL Name:/ { print }'
          else
            echo "objdump is unavailable; DLL imports were not recorded."
          fi
