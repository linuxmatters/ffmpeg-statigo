name: FFmpeg library test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ffmpeg-test.yml"
      - "internal/builder/**"
      - "**/*.go"
      - "av/**"
      - "lib/**"
      - "include/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-test:
    name: Test ${{ matrix.variant }} for ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      BUILDER_FLAGS: ${{ matrix.variant == 'embedded' && '--embedded' || '' }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      BUILD_ROOT: >-
        ${{ matrix.variant == 'embedded' && '.build/embedded' || '.build' }}
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
        variant: [default, embedded]
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-c

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson gperf python3

      - name: Install macOS dependencies
        if: matrix.os == 'darwin'
        run: |
          brew update
          brew install yasm autoconf ragel meson nasm automake libtool python3

      - name: Calculate builder hash
        id: file-hashes
        run: |
          hash=$(shasum -a 256 internal/builder/*.go | shasum -a 256)
          echo "builder-hash=${hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg source downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_ROOT }}/downloads
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-${{
            steps.file-hashes.outputs.builder-hash }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-

      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/staging
            ${{ env.BUILD_ROOT }}/build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-deps-${{ steps.file-hashes.outputs.builder-hash }}

      - name: Build FFmpeg library
        run: go run ./internal/builder/ ${BUILDER_FLAGS:+"$BUILDER_FLAGS"}

      - name: List built files
        run: ls -lh "lib/${LIB_PREFIX}${{ matrix.os }}_${{ matrix.arch }}/"

      - name: Build Go packages
        run: go build -v ./...

      - name: Test Go packages
        run: go test -v ./...
