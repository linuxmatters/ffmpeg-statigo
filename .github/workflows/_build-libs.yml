name: Build FFmpeg libraries

on:
  workflow_call:
    inputs:
      clean_ffmpeg:
        description: "Clean FFmpeg build directory before building"
        type: boolean
        default: false
        required: false
      test:
        description: "Build and test Go packages after building libraries"
        type: boolean
        default: false
        required: false
      build_programs:
        description: "Build, verify, and upload standalone ffmpeg and ffprobe CLI archives"
        type: boolean
        default: true
        required: false
      release_tag:
        description: "Release tag written to NOTICE.txt (defaults to GITHUB_REF_NAME)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  build-unix:
    name: Build ${{ matrix.variant }} for ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      BUILDER_FLAGS: ${{ matrix.variant == 'embedded' && '--embedded' || '' }}
      PROGRAMS_FLAG: ${{ inputs.build_programs && '--programs' || '' }}
      FFMPEG_RELEASE_TAG: ${{ inputs.release_tag }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      ASSET_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded-' || '' }}
      PLATFORM: ${{ matrix.os }}_${{ matrix.arch }}
      ASSET_PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      BUILD_ROOT: >-
        ${{ matrix.variant == 'embedded' && '.build/embedded' || '.build' }}
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
        variant: [default, embedded]
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.variant == 'default' || matrix.os == 'darwin'
        with:
          toolchain: stable
          components: llvm-tools

      - name: Locate llvm-objcopy
        if: matrix.os == 'darwin'
        run: |
          tool="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin/llvm-objcopy"
          test -x "$tool"
          echo "LLVM_OBJCOPY=$tool" >> "$GITHUB_ENV"

      - name: Set macOS deployment target
        if: matrix.os == 'darwin'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: matrix.variant == 'default'
        with:
          cache-bin: false

      - uses: taiki-e/cache-cargo-install-action@v3
        if: matrix.variant == 'default'
        with:
          tool: cargo-c

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson gperf python3

      - name: Install macOS dependencies
        if: matrix.os == 'darwin'
        run: |
          brew update
          brew install yasm autoconf ragel meson nasm automake libtool python3

      - name: Calculate builder hash
        id: file-hashes
        run: |
          hash=$(shasum -a 256 internal/builder/*.go | shasum -a 256)
          echo "builder-hash=${hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg source downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_ROOT }}/downloads
          key: >-
            ${{ matrix.os }}-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-${{
            steps.file-hashes.outputs.builder-hash }}
          restore-keys: >-
            ${{ matrix.os }}-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-

      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/staging
            ${{ env.BUILD_ROOT }}/build
          key: >-
            ${{ matrix.os }}-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-deps-${{
            steps.file-hashes.outputs.builder-hash }}

      - name: Clean FFmpeg build
        if: inputs.clean_ffmpeg
        run: |
          go run ./internal/builder/ \
            ${BUILDER_FLAGS:+"$BUILDER_FLAGS"} \
            ${PROGRAMS_FLAG:+"$PROGRAMS_FLAG"} ffmpeg --clean

      - name: Build FFmpeg library
        run: |
          go run ./internal/builder/ \
            ${BUILDER_FLAGS:+"$BUILDER_FLAGS"} \
            ${PROGRAMS_FLAG:+"$PROGRAMS_FLAG"}

      - name: Verify Linux CLI binaries
        if: inputs.build_programs && matrix.os == 'linux'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bin_dir="bin/${LIB_PREFIX}${PLATFORM}"
          for bin in "$bin_dir/ffmpeg" "$bin_dir/ffprobe"; do
            test -x "$bin"
            test -s "$bin"
          done
          test -s "$bin_dir/LICENSE"
          test -s "$bin_dir/NOTICE.txt"

          if [ "$VARIANT" = default ]; then
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 3' "$bin_dir/LICENSE"
          elif [ "$VARIANT" = embedded ]; then
            grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 2.1' "$bin_dir/LICENSE"
          else
            echo "::error::Unexpected variant: $VARIANT"
            exit 1
          fi

          for bin in "$bin_dir/ffmpeg" "$bin_dir/ffprobe"; do
            echo "=== $bin ==="
            ldd "$bin"

            needed=$(readelf -d "$bin" | sed -En 's/.*\(NEEDED\).*Shared library: \[([^]]+)\].*/\1/p')
            if [ -z "$needed" ]; then
              echo "::error::No DT_NEEDED entries parsed from $bin"
              exit 1
            fi
            while IFS= read -r lib; do
              case "$lib" in
                libc.so.6 | libm.so.6 | libmvec.so.1 | libpthread.so.0 | libdl.so.2 | librt.so.1 | \
                ld-linux-x86-64.so.2 | ld-linux-aarch64.so.1)
                  ;;
                *)
                  echo "::error::$bin has disallowed DT_NEEDED dependency: $lib"
                  exit 1
                  ;;
              esac
            done <<< "$needed"

            versions=$(readelf --version-info "$bin" | awk '/Name:/ { for (i = 1; i <= NF; i++) if ($i == "Name:") print $(i + 1) }' | sort -u)
            if [ -z "$versions" ]; then
              echo "::error::No ELF symbol version entries parsed from $bin"
              exit 1
            fi
            while IFS= read -r ver; do
              if [ "$ver" = "GLIBC_ABI_DT_RELR" ]; then
                continue
              fi
              if [[ "$ver" =~ ^GLIBC_([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
                major=$((10#${BASH_REMATCH[1]}))
                minor=$((10#${BASH_REMATCH[2]}))
                if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -gt 39 ]; }; then
                  echo "::error::$bin requires disallowed glibc symbol version: $ver (max GLIBC_2.39)"
                  exit 1
                fi
              else
                echo "::error::$bin requires disallowed ELF symbol version: $ver"
                exit 1
              fi
            done <<< "$versions"
          done

      - name: Verify macOS CLI binaries
        if: inputs.build_programs && matrix.os == 'darwin'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bin_dir="bin/${LIB_PREFIX}${PLATFORM}"
          for bin in "$bin_dir/ffmpeg" "$bin_dir/ffprobe"; do
            test -x "$bin"
            test -s "$bin"
          done
          test -s "$bin_dir/LICENSE"
          test -s "$bin_dir/NOTICE.txt"

          if [ "$VARIANT" = default ]; then
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 3' "$bin_dir/LICENSE"
          elif [ "$VARIANT" = embedded ]; then
            grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 2.1' "$bin_dir/LICENSE"
          else
            echo "::error::Unexpected variant: $VARIANT"
            exit 1
          fi

          for bin in "$bin_dir/ffmpeg" "$bin_dir/ffprobe"; do
            echo "=== $bin ==="
            codesign --verify --strict "$bin"

            otool_out=$(otool -L "$bin")
            printf '%s\n' "$otool_out"
            deps=$(printf '%s\n' "$otool_out" | tail -n +2 | awk '{ print $1 }')
            if [ -z "$deps" ]; then
              echo "::error::No otool -L dependencies parsed from $bin"
              exit 1
            fi
            while IFS= read -r dep; do
              case "$dep" in
                /usr/lib/* | /System/Library/Frameworks/*)
                  ;;
                *)
                  echo "::error::$bin has disallowed dynamic library dependency: $dep"
                  exit 1
                  ;;
              esac
            done <<< "$deps"

            vtool_out=$(vtool -show-build "$bin")
            printf '%s\n' "$vtool_out"
            minos_list=$(printf '%s\n' "$vtool_out" | awk '$1 == "minos" { print $2 }')
            if [ -z "$minos_list" ]; then
              echo "::error::No minos entry parsed from vtool -show-build for $bin"
              exit 1
            fi
            while IFS= read -r minos; do
              if [[ "$minos" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
                major=$((10#${BASH_REMATCH[1]}))
                minor=$((10#${BASH_REMATCH[2]}))
                patch=$((10#${BASH_REMATCH[4]:-0}))
                if [ "$major" -gt 13 ] || { [ "$major" -eq 13 ] && { [ "$minor" -gt 0 ] || [ "$patch" -gt 0 ]; }; }; then
                  echo "::error::$bin has disallowed macOS minos: $minos (max 13.0)"
                  exit 1
                fi
              else
                echo "::error::$bin has unparseable macOS minos: $minos"
                exit 1
              fi
            done <<< "$minos_list"
          done

      - name: Smoke test CLI binaries
        if: inputs.build_programs
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bin_dir="bin/${LIB_PREFIX}${PLATFORM}"
          "$bin_dir/ffmpeg" -version
          "$bin_dir/ffprobe" -version
          "$bin_dir/ffmpeg" -hide_banner -hwaccels

          if [ "$VARIANT" = default ]; then
            codec="libx264"
          else
            codec="libopenh264"
          fi

          out_mp4="$RUNNER_TEMP/smoke.mp4"
          rm -f "$out_mp4"
          "$bin_dir/ffmpeg" -hide_banner -loglevel error -y \
            -filter_complex "testsrc=duration=1:size=320x240:rate=25,format=yuv420p" \
            -c:v "$codec" "$out_mp4"
          test -s "$out_mp4"

          probe=$("$bin_dir/ffprobe" -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,nb_frames \
            -of default=nw=1 "$out_mp4")
          printf '%s\n' "$probe"
          for expected in \
            "codec_name=h264" \
            "width=320" \
            "height=240" \
            "pix_fmt=yuv420p" \
            "nb_frames=25"; do
            if ! printf '%s\n' "$probe" | grep -Fxq "$expected"; then
              echo "::error::ffprobe output missing expected line: $expected"
              exit 1
            fi
          done
          rm -f "$out_mp4"

      - name: Build Go packages
        if: inputs.test
        run: go build -v ./...

      - name: Test Go packages
        if: inputs.test
        run: go test -v ./...

      - name: Create tarball
        run: |
          archive="ffmpeg-${ASSET_PREFIX}${ASSET_PLATFORM}.tar.gz"
          payload="${LIB_PREFIX}${PLATFORM}/libffmpeg.a"
          test -s "lib/$payload"
          tar -czf "$archive" -C lib "$payload"
          test "$(tar -tzf "$archive")" = "$payload"

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ffmpeg-${{ env.ASSET_PREFIX }}${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Create CLI archive
        if: inputs.build_programs
        run: |
          set -euo pipefail
          bin_dir="bin/${LIB_PREFIX}${PLATFORM}"
          stem="ffmpeg-bin-${ASSET_PREFIX}${ASSET_PLATFORM}"
          archive="${stem}.tar.gz"
          stage_root="$RUNNER_TEMP/cli-stage"

          rm -rf "$stage_root" "$archive"
          mkdir -p "$stage_root/$stem"
          cp "$bin_dir/ffmpeg" "$bin_dir/ffprobe" \
            "$bin_dir/LICENSE" "$bin_dir/NOTICE.txt" "$stage_root/$stem/"
          chmod 0755 "$stage_root/$stem/ffmpeg" "$stage_root/$stem/ffprobe"
          chmod 0644 "$stage_root/$stem/LICENSE" "$stage_root/$stem/NOTICE.txt"

          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$stage_root" \
            "$stem/ffmpeg" "$stem/ffprobe" "$stem/LICENSE" "$stem/NOTICE.txt"
          test -s "$archive"

          actual=$(tar -tzf "$archive" | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            "$stem/LICENSE" \
            "$stem/NOTICE.txt" \
            "$stem/ffmpeg" \
            "$stem/ffprobe")
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected archive entries in $archive:"
            printf '%s\n' "$actual"
            exit 1
          fi
          rm -rf "$stage_root"

      - name: Upload CLI artifact
        if: inputs.build_programs
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-bin-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ffmpeg-bin-${{ env.ASSET_PREFIX }}${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build ${{ matrix.variant }} for windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            variant: default
            msystem: UCRT64
            bin: /ucrt64/bin
            package-prefix: mingw-w64-ucrt-x86_64
            nasm-package: mingw-w64-ucrt-x86_64-nasm
            yasm-package: mingw-w64-ucrt-x86_64-yasm
            extra-packages: >-
              mingw-w64-ucrt-x86_64-meson
              mingw-w64-ucrt-x86_64-rust
              mingw-w64-ucrt-x86_64-cargo-c
            cc-target: x86_64-w64-mingw32
            object-arch: i386:x86-64
            asm-format: win64
            build-root: .build
          - arch: amd64
            variant: embedded
            msystem: UCRT64
            bin: /ucrt64/bin
            package-prefix: mingw-w64-ucrt-x86_64
            nasm-package: mingw-w64-ucrt-x86_64-nasm
            yasm-package: mingw-w64-ucrt-x86_64-yasm
            extra-packages: ""
            cc-target: x86_64-w64-mingw32
            object-arch: i386:x86-64
            asm-format: win64
            build-root: .build/embedded
          - arch: "386"
            variant: default
            msystem: MINGW32
            bin: /mingw32/bin
            package-prefix: mingw-w64-i686
            # MSYS2 has no i686 NASM or YASM packages.
            # The host assemblers emit Win32 objects.
            nasm-package: nasm
            yasm-package: yasm
            extra-packages: mingw-w64-i686-meson
            cc-target: i686-w64-mingw32
            object-arch: i386
            asm-format: win32
            build-root: .build/windows_386_msvcrt
          - arch: "386"
            variant: embedded
            msystem: MINGW32
            bin: /mingw32/bin
            package-prefix: mingw-w64-i686
            nasm-package: nasm
            yasm-package: yasm
            extra-packages: ""
            cc-target: i686-w64-mingw32
            object-arch: i386
            asm-format: win32
            build-root: .build/embedded/windows_386_msvcrt
    defaults:
      run:
        shell: msys2 {0}
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
      MINGW_BIN: ${{ matrix.bin }}
      CC_TARGET: ${{ matrix.cc-target }}
      OBJECT_ARCH: ${{ matrix.object-arch }}
      ASM_FORMAT: ${{ matrix.asm-format }}
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      BUILDER_FLAGS: ${{ matrix.variant == 'embedded' && '--embedded' || '' }}
      PROGRAMS_FLAG: ${{ inputs.build_programs && '--programs' || '' }}
      FFMPEG_RELEASE_TAG: ${{ inputs.release_tag }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      ASSET_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded-' || '' }}
      BUILD_ROOT: ${{ matrix.build-root }}
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Set up Rust host tools for Windows 386
        if: matrix.variant == 'default' && matrix.arch == '386'
        shell: pwsh
        run: |
          $toolchain = '1.93.1-x86_64-pc-windows-msvc'
          rustup toolchain install $toolchain --profile minimal `
            --target i686-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$toolchain" install cargo-c --version 0.10.20 --locked `
            --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustBin = Split-Path (Get-Command cargo).Source
          "RUST_BIN=$rustBin" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "RUSTUP_TOOLCHAIN=$toolchain" |
            Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Capture Go binary directory
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go).Source
          "GO_BIN=$goBin" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      # msys2/setup-msys2 v2.33.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: false
          path-type: minimal
          install: >-
            autoconf
            automake
            diffutils
            git
            libtool
            make
            patch
            perl
            ${{ matrix.package-prefix }}-binutils
            ${{ matrix.package-prefix }}-cmake
            ${{ matrix.package-prefix }}-gcc
            ${{ matrix.nasm-package }}
            ${{ matrix.package-prefix }}-ninja
            ${{ matrix.package-prefix }}-pkgconf
            ${{ matrix.package-prefix }}-python
            ${{ matrix.yasm-package }}
            ${{ matrix.extra-packages }}

      - name: Record and validate toolchain
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          if [ -n "${RUST_BIN:-}" ]; then
            rust_bin="$(cygpath -u "$RUST_BIN")"
            PATH="$rust_bin:$PATH"
          fi
          export PATH
          CC="$(cygpath -m "$MINGW_BIN/gcc.exe")"
          CXX="$(cygpath -m "$MINGW_BIN/g++.exe")"
          export CC CXX
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          go version
          go env GOOS GOARCH CGO_ENABLED CC CXX GOFLAGS
          "$CC" --version
          "$CC" -dumpmachine
          test "$("$CC" -dumpmachine)" = "$CC_TARGET"
          "$CXX" --version
          cmake --version
          ninja --version
          if [ "$VARIANT" = default ]; then
            test -z "$(go env GOFLAGS)"
            meson --version
            rustc -vV
            cargo --version
            cargo cinstall --version
            nasm --version
            yasm --version
            printf 'section .text\nret\n' > "$RUNNER_TEMP/assembler-check.asm"
            for assembler in nasm yasm; do
              "$assembler" -f "$ASM_FORMAT" \
                "$RUNNER_TEMP/assembler-check.asm" \
                -o "$RUNNER_TEMP/$assembler-check.o"
              objdump -f "$RUNNER_TEMP/$assembler-check.o" |
                awk -v expected="$OBJECT_ARCH," '
                /^architecture:/ {
                  print
                  found = 1
                  if ($2 != expected) invalid = 1
                }
                END { if (!found || invalid) exit 1 }
              '
            done
          fi
          ar --version
          pacman -Q
          df -h .

      - name: Calculate builder hash
        id: file-hashes
        run: |
          set -euo pipefail
          hash=$(sha256sum internal/builder/*.go | sha256sum)
          echo "builder-hash=${hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg source downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_ROOT }}/downloads
          key: >-
            windows-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-${{
            steps.file-hashes.outputs.builder-hash }}
          restore-keys: >-
            windows-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-

      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/staging
            ${{ env.BUILD_ROOT }}/build
          key: >-
            windows-${{ matrix.arch }}-ffmpeg-${{
            matrix.variant }}-deps-${{
            steps.file-hashes.outputs.builder-hash }}

      - name: Clean FFmpeg build
        if: inputs.clean_ffmpeg
        env:
          MSYS2_ENV_CONV_EXCL: ACLOCAL_PATH
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go run ./internal/builder/ \
            ${BUILDER_FLAGS:+"$BUILDER_FLAGS"} \
            ${PROGRAMS_FLAG:+"$PROGRAMS_FLAG"} ffmpeg --clean

      - name: Build FFmpeg library
        env:
          MSYS2_ENV_CONV_EXCL: ACLOCAL_PATH
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          if [ -n "${RUST_BIN:-}" ]; then
            rust_bin="$(cygpath -u "$RUST_BIN")"
            PATH="$rust_bin:$PATH"
          fi
          export PATH
          go run ./internal/builder/ \
            ${BUILDER_FLAGS:+"$BUILDER_FLAGS"} \
            ${PROGRAMS_FLAG:+"$PROGRAMS_FLAG"}

      - name: Validate archive
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          archive="lib/${LIB_PREFIX}windows_${GOARCH}/libffmpeg.a"
          test -s "$archive"
          ls -lh "$archive"
          sha256sum "$archive"
          ar t "$archive" | awk '
            NR <= 20 { print }
            END { print "Archive members:", NR; if (NR == 0) exit 1 }
          '
          objdump -f "$archive" | awk -v expected="$OBJECT_ARCH," '
            /^architecture:/ {
              if (++members <= 20) print
              if ($2 != expected) invalid = 1
            }
            END {
              print "Archive object headers:", members
              if (members == 0 || invalid) exit 1
            }
          '
          df -h .

      - name: Verify Windows CLI binary DLLs
        if: inputs.build_programs
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          go_bin_dir="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin_dir:$PATH"
          export PATH
          bin_dir="bin/${LIB_PREFIX}windows_${GOARCH}"

          for bin in "$bin_dir/ffmpeg.exe" "$bin_dir/ffprobe.exe"; do
            test -s "$bin"
          done
          test -s "$bin_dir/LICENSE"
          test -s "$bin_dir/NOTICE.txt"

          if [ "$VARIANT" = default ]; then
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 3' "$bin_dir/LICENSE"
          elif [ "$VARIANT" = embedded ]; then
            grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$bin_dir/LICENSE"
            grep -q 'Version 2.1' "$bin_dir/LICENSE"
          else
            echo "::error::Unexpected variant: $VARIANT"
            exit 1
          fi

          for bin in "$bin_dir/ffmpeg.exe" "$bin_dir/ffprobe.exe"; do
            echo "=== $bin ==="
            dlls=$(objdump -p "$bin" | awk '/DLL Name:/ { sub(/\r$/, "", $3); print tolower($3) }' | sort -u)
            printf '%s\n' "$dlls"
            if [ -z "$dlls" ]; then
              echo "::error::No DLL imports parsed from $bin"
              exit 1
            fi
            while IFS= read -r dll; do
              case "$dll" in
                advapi32.dll | avicap32.dll | bcrypt.dll | crypt32.dll | gdi32.dll | iphlpapi.dll | \
                kernel32.dll | mfplat.dll | mfuuid.dll | msvfw32.dll | ntdll.dll | ole32.dll | \
                oleaut32.dll | psapi.dll | secur32.dll | shell32.dll | shlwapi.dll | strmiids.dll | \
                user32.dll | userenv.dll | vfw32.dll | winmm.dll | ws2_32.dll | \
                api-ms-win-core-synch-l1-2-0.dll)
                  ;;
                ucrtbase.dll | api-ms-win-crt-*.dll)
                  if [ "$GOARCH" != amd64 ]; then
                    echo "::error::$bin ($GOARCH) imports UCRT DLL disallowed on $GOARCH: $dll"
                    exit 1
                  fi
                  ;;
                msvcrt.dll)
                  if [ "$GOARCH" != 386 ]; then
                    echo "::error::$bin ($GOARCH) imports msvcrt.dll disallowed on $GOARCH: $dll"
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::$bin has disallowed DLL dependency: $dll"
                  exit 1
                  ;;
              esac
            done <<< "$dlls"
          done

      - name: Smoke test Windows CLI binaries
        if: inputs.build_programs
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = 'C:\Windows\System32;C:\Windows'

          $libSubdir = if ($env:LIB_PREFIX) {
            Join-Path ($env:LIB_PREFIX.TrimEnd('/')) "windows_$($env:GOARCH)"
          } else {
            "windows_$($env:GOARCH)"
          }
          $binDir = Join-Path 'bin' $libSubdir
          $ffmpeg = Join-Path $binDir 'ffmpeg.exe'
          $ffprobe = Join-Path $binDir 'ffprobe.exe'

          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $codec = if ($env:VARIANT -eq 'default') { 'libx264' } else { 'libopenh264' }
          $outMp4 = Join-Path $env:RUNNER_TEMP 'smoke.mp4'
          Remove-Item -Force -ErrorAction SilentlyContinue $outMp4

          & $ffmpeg -hide_banner -loglevel error -y `
            -filter_complex 'testsrc=duration=1:size=320x240:rate=25,format=yuv420p' `
            -c:v $codec $outMp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $outMp4) -or (Get-Item $outMp4).Length -le 0) {
            throw "Expected non-empty smoke test output at $outMp4"
          }

          $probe = & $ffprobe -v error -select_streams v:0 `
            -show_entries stream=codec_name,width,height,pix_fmt,nb_frames `
            -of default=nw=1 $outMp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe | ForEach-Object { Write-Host $_ }

          $probeLines = @($probe | ForEach-Object { $_.Trim() })
          $expected = @(
            'codec_name=h264',
            'width=320',
            'height=240',
            'pix_fmt=yuv420p',
            'nb_frames=25'
          )
          foreach ($line in $expected) {
            if ($probeLines -cnotcontains $line) {
              throw "ffprobe output missing expected line: $line"
            }
          }
          Remove-Item -Force $outMp4

      - name: Build Go packages
        if: inputs.test
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go build -v ./...

      - name: Test Go packages
        if: inputs.test
        run: |
          set -euo pipefail
          go_bin="$(cygpath -u "$GO_BIN")"
          PATH="$MINGW_BIN:$go_bin:$PATH"
          export PATH
          go test -v ./...

      - name: Create tarball
        run: |
          set -euo pipefail
          archive="ffmpeg-${ASSET_PREFIX}windows-${GOARCH}.tar.gz"
          payload="${LIB_PREFIX}windows_${GOARCH}/libffmpeg.a"
          test -s "lib/$payload"
          tar -czf "$archive" -C lib "$payload"
          test "$(tar -tzf "$archive")" = "$payload"

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.variant }}-windows-${{ matrix.arch }}
          path: ffmpeg-${{ env.ASSET_PREFIX }}windows-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Create CLI archive
        if: inputs.build_programs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $libSubdir = if ($env:LIB_PREFIX) {
            Join-Path ($env:LIB_PREFIX.TrimEnd('/')) "windows_$($env:GOARCH)"
          } else {
            "windows_$($env:GOARCH)"
          }
          $binDir = Join-Path 'bin' $libSubdir
          $stem = "ffmpeg-bin-$($env:ASSET_PREFIX)windows-$($env:GOARCH)"
          $archive = "$stem.zip"
          $stageRoot = Join-Path $env:RUNNER_TEMP 'cli-stage'
          $stageDir = Join-Path $stageRoot $stem

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $stageRoot
          Remove-Item -Force -ErrorAction SilentlyContinue $archive
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          foreach ($file in @('ffmpeg.exe', 'ffprobe.exe', 'LICENSE', 'NOTICE.txt')) {
            Copy-Item -Path (Join-Path $binDir $file) -Destination (Join-Path $stageDir $file)
          }

          Compress-Archive -Path $stageDir -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -le 0) {
            throw "Expected non-empty archive at $archive"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('\')) {
                throw "Archive entry contains backslash separator: $($entry.FullName)"
              }
            }
            $fileEntries = @($zip.Entries | Where-Object {
              -not $_.FullName.EndsWith('/') -and -not $_.FullName.EndsWith('\')
            })
            foreach ($entry in $fileEntries) {
              if ($entry.Length -le 0) {
                throw "Archive entry is empty: $($entry.FullName)"
              }
            }
            $actual = @($fileEntries | ForEach-Object { $_.FullName } | Sort-Object -CaseSensitive)
            $expected = @(
              "$stem/LICENSE",
              "$stem/NOTICE.txt",
              "$stem/ffmpeg.exe",
              "$stem/ffprobe.exe"
            ) | Sort-Object -CaseSensitive
            if (($actual -join "`n") -cne ($expected -join "`n")) {
              throw "Unexpected archive entries in ${archive}:`n$($actual -join "`n")"
            }
          } finally {
            $zip.Dispose()
          }

          Remove-Item -Recurse -Force $stageRoot

      - name: Upload CLI artifact
        if: inputs.build_programs
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-bin-${{ matrix.variant }}-windows-${{ matrix.arch }}
          path: ffmpeg-bin-${{ env.ASSET_PREFIX }}windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1
