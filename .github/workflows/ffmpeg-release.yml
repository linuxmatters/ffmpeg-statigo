name: FFmpeg library release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpeg library version (e.g., lib-8.1.1.0)"
        required: true
  push:
    tags:
      - "lib-[0-9]*.[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  ffmpeg-release:
    name: Build ${{ matrix.variant }} for ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.variant == 'embedded' && '-tags=embedded' || '' }}
      BUILDER_FLAGS: ${{ matrix.variant == 'embedded' && '--embedded' || '' }}
      LIB_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded/' || '' }}
      ASSET_PREFIX: ${{ matrix.variant == 'embedded' && 'embedded-' || '' }}
      BUILD_ROOT: >-
        ${{ matrix.variant == 'embedded' && '.build/embedded' || '.build' }}
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
        variant: [default, embedded]
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
      fail-fast: false

    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^lib-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must match lib-X.Y.Z.N (e.g., lib-8.1.1.0)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-c

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm meson gperf python3

      - name: Install macOS dependencies
        if: matrix.os == 'darwin'
        run: |
          brew update
          brew install yasm autoconf ragel meson nasm automake libtool python3

      - name: Calculate builder hash
        id: file-hashes
        run: |
          hash=$(shasum -a 256 internal/builder/*.go | shasum -a 256)
          echo "builder-hash=${hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg source downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_ROOT }}/downloads
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-${{
            steps.file-hashes.outputs.builder-hash }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-downloads-

      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/staging
            ${{ env.BUILD_ROOT }}/build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{
            matrix.variant }}-deps-${{ steps.file-hashes.outputs.builder-hash }}

      - name: Clean FFmpeg build
        run: |
          go run ./internal/builder/ \
            ${BUILDER_FLAGS:+"$BUILDER_FLAGS"} ffmpeg --clean

      - name: Build FFmpeg library
        run: go run ./internal/builder/ ${BUILDER_FLAGS:+"$BUILDER_FLAGS"}

      - name: Build Go packages
        run: go build -v ./...

      - name: Test Go packages
        run: go test -v ./...

      - name: Create tarball
        env:
          PLATFORM: ${{ matrix.os }}_${{ matrix.arch }}
          ASSET_PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          archive="ffmpeg-${ASSET_PREFIX}${ASSET_PLATFORM}.tar.gz"
          payload="${LIB_PREFIX}${PLATFORM}/libffmpeg.a"
          tar -czf "$archive" -C lib "$payload"
          test "$(tar -tzf "$archive")" = "$payload"

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ffmpeg-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish FFmpeg libraries
    needs: ffmpeg-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download library artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Create checksums
        run: |
          sha256sum ffmpeg-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ffmpeg-*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            ## FFmpeg Static Libraries

            **Version:** ${{ inputs.version || github.ref_name }}

            Default and embedded libraries are available for:
            - Linux amd64
            - Linux arm64
            - macOS x86 (Intel)
            - macOS arm64 (Apple Silicon)

            Use `GOFLAGS=-tags=embedded` to download and use embedded libraries.
            `SHA256SUMS` covers both profiles.
