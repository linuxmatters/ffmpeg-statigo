name: FFmpeg library release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpeg library version (e.g., lib-8.1.2.1)"
        required: true
        type: string
  push:
    tags:
      - "lib-[0-9]*.[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag and version parity
        id: check
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^lib-([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Version must match lib-X.Y.Z.N (e.g., lib-8.1.2.1), got: $VERSION"
            exit 1
          fi
          tag_ffmpeg_version="${BASH_REMATCH[1]}"

          lib_release=$(sed -En 's/^[[:space:]]*const[[:space:]]+LibRelease[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' lib/fetch.go)
          if [[ "$VERSION" != "$lib_release" ]]; then
            echo "::error::Release tag ($VERSION) does not match LibRelease in lib/fetch.go ($lib_release)"
            exit 1
          fi

          lib_version=$(sed -En 's/^[[:space:]]*const[[:space:]]+Version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' lib/fetch.go)
          if [[ "$tag_ffmpeg_version" != "$lib_version" ]]; then
            echo "::error::Tag FFmpeg version ($tag_ffmpeg_version) does not match Version in lib/fetch.go ($lib_version)"
            exit 1
          fi

          builder_ffmpeg_version=$(sed -En 's|^[[:space:]]*URL:[[:space:]]*"https://github\.com/FFmpeg/FFmpeg/archive/refs/tags/n([0-9]+\.[0-9]+\.[0-9]+)\.tar\.[^"]+",[[:space:]]*$|\1|p' internal/builder/libraries.go)
          if [[ "$tag_ffmpeg_version" != "$builder_ffmpeg_version" ]]; then
            echo "::error::Tag FFmpeg version ($tag_ffmpeg_version) does not match FFmpeg URL in internal/builder/libraries.go ($builder_ffmpeg_version)"
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  build-libs:
    needs: validate
    uses: ./.github/workflows/_build-libs.yml
    with:
      clean_ffmpeg: true
      test: true

  publish:
    name: Publish FFmpeg libraries
    needs: [validate, build-libs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download library artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Verify archives and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected=(
            ffmpeg-darwin-amd64.tar.gz
            ffmpeg-darwin-arm64.tar.gz
            ffmpeg-embedded-darwin-amd64.tar.gz
            ffmpeg-embedded-darwin-arm64.tar.gz
            ffmpeg-embedded-linux-amd64.tar.gz
            ffmpeg-embedded-linux-arm64.tar.gz
            ffmpeg-embedded-windows-386.tar.gz
            ffmpeg-embedded-windows-amd64.tar.gz
            ffmpeg-linux-amd64.tar.gz
            ffmpeg-linux-arm64.tar.gz
            ffmpeg-windows-386.tar.gz
            ffmpeg-windows-amd64.tar.gz
          )

          for archive in "${expected[@]}"; do
            if [[ ! -s "$archive" ]]; then
              echo "::error::Missing or empty archive: $archive"
              exit 1
            fi
          done

          actual=(ffmpeg-*.tar.gz)
          if (( ${#actual[@]} != ${#expected[@]} )); then
            echo "::error::Expected ${#expected[@]} archives, found ${#actual[@]}: ${actual[*]}"
            exit 1
          fi

          LC_ALL=C sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ffmpeg-*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## FFmpeg Static Libraries

            **Version:** ${{ needs.validate.outputs.tag }}

            Default and embedded libraries are available for:
            - Linux amd64
            - Linux arm64
            - macOS x86 (Intel)
            - macOS arm64 (Apple Silicon)
            - Windows amd64
            - Windows 386

            Use `GOFLAGS=-tags=embedded` to download and use embedded libraries.
            `SHA256SUMS` covers both profiles.
