<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="s6-em-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="s6-em-bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="s6-cy-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#00add8"/>
    </linearGradient>
    <linearGradient id="s6-cy-bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="s6-key" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Precision-matched unframed dark contour rim hugging both >> blocks cleanly -->
  <g id="emblem-rim" fill="#0b151e" stroke="#0b151e" stroke-width="5.2" stroke-linejoin="round">
    <polygon points="7,12.5 23.5,12.5 37.5,32 23.5,51.5 7,51.5 17,32"/>
    <polygon points="28,12.5 44,12.5 58,32 44,51.5 28,51.5 42,32"/>
  </g>

  <!-- Rear solid chisel-bevelled emerald > block -->
  <g id="rear-block">
    <polygon points="7,12.5 23.5,12.5 37.5,32 17,32" fill="url(#s6-em-top)"/>
    <polygon points="17,32 37.5,32 23.5,51.5 7,51.5" fill="url(#s6-em-bot)"/>
    <!-- Crisp upper chamfer highlight -->
    <polygon points="7,12.5 23.5,12.5 22.2,15 8.8,15" fill="#a7f3d0" opacity="0.5"/>
  </g>

  <!-- Front solid chisel-bevelled Go-cyan > spearhead locked tightly to rear block -->
  <g id="front-block">
    <polygon points="28,12.5 44,12.5 58,32 42,32" fill="url(#s6-cy-top)"/>
    <polygon points="42,32 58,32 44,51.5 28,51.5" fill="url(#s6-cy-bot)"/>
    <!-- Crisp upper chamfer highlight -->
    <polygon points="28,12.5 44,12.5 42.8,15 29.8,15" fill="#cffafe" opacity="0.5"/>
  </g>

  <!-- Amber-gold static fusion lock key bridging the machined joint at centre -->
  <g id="fusion-lock">
    <polygon points="31.5,28.5 41.8,28.5 44.5,32 41.8,35.5 31.5,35.5 34.2,32" fill="url(#s6-key)" stroke="#0b151e" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="31.5,28.5 41.8,28.5 44.5,32 34.2,32" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
